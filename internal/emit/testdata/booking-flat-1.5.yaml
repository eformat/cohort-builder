---
apiVersion: kueue.x-k8s.io/v1beta2
kind: Cohort
metadata:
  name: unreserved
spec:
  resourceGroups:
  - coveredResources:
    - cpu
    - memory
    - nvidia.com/gpu
    - nvidia.com/mig-1g.18gb
    - nvidia.com/mig-2g.35gb
    - nvidia.com/mig-3g.71gb
    flavors:
    - name: h200
      resources:
      - name: cpu
        nominalQuota: "159"
      - name: memory
        nominalQuota: 1873Gi
      - name: nvidia.com/gpu
        nominalQuota: "1"
      - name: nvidia.com/mig-1g.18gb
        nominalQuota: "16"
      - name: nvidia.com/mig-2g.35gb
        nominalQuota: "8"
      - name: nvidia.com/mig-3g.71gb
        nominalQuota: "8"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: unreserved
spec:
  cohortName: unreserved
  flavorFungibility:
    whenCanBorrow: MayStopSearch
    whenCanPreempt: TryNextFlavor
  namespaceSelector: {}
  preemption:
    borrowWithinCohort:
      policy: Never
    reclaimWithinCohort: Never
    withinClusterQueue: Never
  queueingStrategy: BestEffortFIFO
  resourceGroups:
  - coveredResources:
    - cpu
    - memory
    - nvidia.com/gpu
    - nvidia.com/mig-1g.18gb
    - nvidia.com/mig-2g.35gb
    - nvidia.com/mig-3g.71gb
    flavors:
    - name: h200
      resources:
      - name: cpu
        nominalQuota: "0"
      - name: memory
        nominalQuota: "0"
      - name: nvidia.com/gpu
        nominalQuota: "0"
      - name: nvidia.com/mig-1g.18gb
        nominalQuota: "0"
      - name: nvidia.com/mig-2g.35gb
        nominalQuota: "0"
      - name: nvidia.com/mig-3g.71gb
        nominalQuota: "0"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: unreserved-priority
spec:
  cohortName: unreserved
  flavorFungibility:
    whenCanBorrow: MayStopSearch
    whenCanPreempt: TryNextFlavor
  namespaceSelector: {}
  preemption:
    borrowWithinCohort:
      maxPriorityThreshold: 100
      policy: LowerPriority
    reclaimWithinCohort: LowerPriority
    withinClusterQueue: Never
  queueingStrategy: BestEffortFIFO
  resourceGroups:
  - coveredResources:
    - cpu
    - memory
    - nvidia.com/gpu
    - nvidia.com/mig-1g.18gb
    - nvidia.com/mig-2g.35gb
    - nvidia.com/mig-3g.71gb
    flavors:
    - name: h200
      resources:
      - name: cpu
        nominalQuota: "0"
      - name: memory
        nominalQuota: "0"
      - name: nvidia.com/gpu
        nominalQuota: "0"
      - name: nvidia.com/mig-1g.18gb
        nominalQuota: "0"
      - name: nvidia.com/mig-2g.35gb
        nominalQuota: "0"
      - name: nvidia.com/mig-3g.71gb
        nominalQuota: "0"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: user-avitui
spec:
  cohortName: unreserved
  flavorFungibility:
    whenCanBorrow: MayStopSearch
    whenCanPreempt: TryNextFlavor
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: user-avitui
  preemption:
    borrowWithinCohort:
      policy: Never
    reclaimWithinCohort: Any
    withinClusterQueue: Never
  queueingStrategy: BestEffortFIFO
  resourceGroups:
  - coveredResources:
    - cpu
    - memory
    - nvidia.com/gpu
    flavors:
    - name: h200
      resources:
      - name: cpu
        nominalQuota: "26"
      - name: memory
        nominalQuota: 241Gi
      - name: nvidia.com/gpu
        nominalQuota: "1"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: default
  namespace: user-avitui
spec:
  clusterQueue: user-avitui
