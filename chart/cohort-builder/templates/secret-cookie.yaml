# OAuth-proxy cookie secret. Autogenerated once; `lookup` keeps it stable
# across upgrades so existing logins survive. Set oauth.existingCookieSecret
# to bring your own instead (then nothing is rendered here).
{{- $name := include "cohort-builder.name" . }}
{{- if not .Values.oauth.existingCookieSecret }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-cookie" $name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-cookie
  labels:
    app: {{ $name }}
type: Opaque
data:
  cookie-secret: {{ if $existing }}{{ index $existing.data "cookie-secret" }}{{ else }}{{ randBytes 32 | b64enc }}{{ end }}
{{- end }}
