# ServiceAccount doubles as the OpenShift OAuth client for the oauth-proxy
# sidecar (same pattern as rhoai-version-tracker). The redirect reference
# points at the Route, so the allowed redirect URI auto-follows whatever host
# the route is assigned.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cohort-builder.name" . }}
  labels:
    app: {{ include "cohort-builder.name" . }}
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.primary: >-
      {"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"{{ include "cohort-builder.name" . }}"}}
