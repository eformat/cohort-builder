apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cohort-builder.name" . }}-data
  labels:
    app: {{ include "cohort-builder.name" . }}
spec:
  accessModes:
  - ReadWriteOnce
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
