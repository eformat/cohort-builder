{{- if eq .Values.oauth.accessMode "restricted" }}
# Required by accessMode=restricted: lets the oauth-proxy create TokenReviews
# to authenticate users and SubjectAccessReviews for the delegate-urls check.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ include "cohort-builder.name" . }}-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
- kind: ServiceAccount
  name: {{ include "cohort-builder.name" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
