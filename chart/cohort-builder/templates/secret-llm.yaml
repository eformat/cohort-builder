{{- if not .Values.llm.existingSecret }}
# Optional convenience: create the LLM secret from values for quick local
# testing. For real deploys prefer an existing Secret created with file refs
# (kubectl create secret generic ... --from-env-file=.env) so the key never
# lands in the helm release values.
{{- if .Values.llm.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cohort-builder.name" . }}-llm
  labels:
    app: {{ include "cohort-builder.name" . }}
type: Opaque
stringData:
  OPENAI_BASE_URL: {{ .Values.llm.baseUrl | quote }}
  OPENAI_API_KEY: {{ .Values.llm.apiKey | quote }}
  OPENAI_MODEL_NAME: {{ .Values.llm.model | quote }}
{{- end }}
{{- end }}
